<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" role="img" aria-label="InAmigos Foundation — Uniting Minds for Change">
  <title>InAmigos Foundation</title>

  <!-- ── Star / People mark (centered at 45,38, radius ~34) ── -->
  <g transform="translate(45,38)">

    <!-- Star background pentagon points — subtle guide, transparent -->

    <!-- TOP person (red/orange) -->
    <g fill="#E8472A">
      <!-- body arc -->
      <path d="M0,-34 C-7,-28 -9,-18 -5,-10 C-2,-4 2,-4 5,-10 C9,-18 7,-28 0,-34Z"/>
      <!-- head -->
      <circle cx="0" cy="-38" r="5.5"/>
    </g>

    <!-- TOP-RIGHT person (blue) -->
    <g fill="#2C82C9">
      <path d="M29,-19 C22,-16 17,-8 18,0 C19,5 23,6 27,2 C33,-5 34,-15 29,-19Z"/>
      <circle cx="33" cy="-22" r="5.5"/>
    </g>

    <!-- BOTTOM-RIGHT person (purple) -->
    <g fill="#8B44A8">
      <path d="M18,22 C11,19 4,23 2,31 C0,36 3,39 8,37 C16,33 22,27 18,22Z"/>
      <circle cx="22" cy="25" r="5.5"/>
    </g>

    <!-- BOTTOM-LEFT person (teal/green) -->
    <g fill="#1DA462">
      <path d="M-18,22 C-22,27 -16,33 -8,37 C-3,39 0,36 -2,31 C-4,23 -11,19 -18,22Z"/>
      <circle cx="-22" cy="25" r="5.5"/>
    </g>

    <!-- TOP-LEFT person (orange/yellow) -->
    <g fill="#F4A21B">
      <path d="M-29,-19 C-34,-15 -33,-5 -27,2 C-23,6 -19,5 -18,0 C-17,-8 -22,-16 -29,-19Z"/>
      <circle cx="-33" cy="-22" r="5.5"/>
    </g>

    <!-- Star polygon (multi-color segments, drawn as one star shape with gradient) -->
    <!-- Use a 5-pointed star path, filled with a radial green for the inner IAF area -->
    <!-- Inner star overlay -->
    <polygon
      points="0,-22  6,-8  20,-8  9,2  13,16  0,8  -13,16  -9,2  -20,-8  -6,-8"
      fill="#1DA462" opacity="0.92"/>

    <!-- IAF text -->
    <text x="0" y="5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
          font-size="9" font-weight="900" fill="white" letter-spacing="0.5">IAF</text>
  </g>

  <!-- ── Wordmark ── -->
  <!-- InAmigos® -->
  <text x="90" y="28" font-family="Arial Black, Arial, sans-serif"
        font-size="20" font-weight="900" fill="#1a1a1a" letter-spacing="-0.3">InAmigos</text>
  <!-- Registered mark -->
  <text x="222" y="20" font-family="Arial, sans-serif"
        font-size="9" fill="#1a1a1a">®</text>

  <!-- FOUNDATION -->
  <text x="90" y="44" font-family="Arial, sans-serif"
        font-size="9.5" font-weight="700" fill="#1a1a1a" letter-spacing="3.5">FOUNDATION</text>

  <!-- Uniting Minds for Change -->
  <text x="90" y="59" font-family="Arial, sans-serif"
        font-size="9" fill="#333333" letter-spacing="0.3" font-style="italic">Uniting Minds for Change</text>
</svg>
